name: CI

# Test runner real (vitest + tsc) en cada push y PR a main.
#
# Matriz windows + ubuntu: Shinobi es un agente NATIVO DE WINDOWS (tools por
# PowerShell, cifrado en reposo por DPAPI, sandbox que valida paths Windows), así
# que Windows es la plataforma de referencia. Lo específico de Windows se salta
# con un motivo visible donde la capacidad no existe o no es fiable — Linux, o el
# runner windows-latest de GitHub (cuenta de servicio) — ver
# src/__tests__/_platform_probe.ts. En un runner Windows self-hosted con sesión
# interactiva: SHINOBI_CI_RUN_WIN_NATIVE=1 para forzarlos.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install --no-audit --no-fund

      # Habilita los E2E de navegador (src/browser/__tests__/); si no, se saltan
      # con motivo (src/browser/__tests__/_playwright_available.ts).
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Gate estricto: 0 errores de tipo tolerados. Si tsc falla aquí, el merge no pasa.
      - name: Typecheck (estricto, 0 errores)
        run: npx tsc --noEmit

      - name: Vitest
        run: npm test

      # npm audit: INFORMATIVO, no bloqueante. Lo que queda son vulnerabilidades
      # transitivas en `sharp`/libvips (CVEs de una librería C con churn
      # constante) y en la cadena de `@e2b/sdk` (SDK cloud opcional sin versión
      # estable sin la vuln). Bloquear el merge por `high` transitivo deja la CI
      # en rojo permanente; el reporte sigue visible en cada run. Los gates
      # F1/F2/F3 y los smokes D-015/016/017 viven aparte en gates.yml.
      - name: npm audit (informativo)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
