name: Release

# G3.1 — fires when package.json version changes on main, plus manual dispatch
# for emergency re-runs (or a dry_run to validate the pipeline without publishing).
# Builds the portable .exe via @yao-pkg/pkg (P6, remediación 2026-07-01 — la ruta
# Node SEA se retiró: no soportaba require() de nativos de terceros y nunca
# arrancaba, ver DECISIONES.md), la arranca de verdad como smoke test, genera un
# SBOM (deps + hashes exactos), un changelog desde conventional commits, crea un
# GitHub Release con los assets, y pinga Discord (G3.3).
#
# "Verifiable build", no "reproducible build": no prometemos un .exe
# byte-idéntico (Windows + pkg no lo permite razonablemente) — el SBOM permite
# verificar QUÉ entró (deps + hashes), no reproducir el binario bit a bit.
on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Force a release for this version (e.g. 1.0.0). Leave blank to auto-detect.'
        required: false
      dry_run:
        description: 'Build + smoke-test + SBOM only — no tag, no GitHub release, no Discord ping.'
        type: boolean
        required: false
        default: false

permissions:
  contents: write   # needed to create the GitHub release + tag

jobs:
  release:
    runs-on: windows-latest  # pkg target node24-win-x64 produce Shinobi.exe
    timeout-minutes: 30
    steps:
      - name: Checkout (full history for changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Debe coincidir con el target de pkg en scripts/build_exe.ts (node24-win-x64):
      # `npm ci` instala el binario nativo prebuilt de better-sqlite3/isolated-vm para
      # la versión de Node que corre AQUÍ, no para la que pkg empaqueta — un desajuste
      # de NODE_MODULE_VERSION (ABI) revienta el .exe en runtime con ERR_DLOPEN_FAILED
      # (encontrado en CI real: runner con Node 22 → ABI 127, pkg target Node 24 → ABI
      # 137; ver DECISIONES.md).
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Detect version
        id: ver
        shell: pwsh
        run: |
          $forced = "${{ github.event.inputs.version }}"
          if ($forced) {
            $current = $forced
          } else {
            $current = (Get-Content package.json | ConvertFrom-Json).version
          }
          $tag = "v$current"
          $existing = git tag --list $tag
          if ($existing) {
            "tag_exists=true"  | Out-File $env:GITHUB_OUTPUT -Append
          } else {
            "tag_exists=false" | Out-File $env:GITHUB_OUTPUT -Append
          }
          "version=$current"   | Out-File $env:GITHUB_OUTPUT -Append
          "tag=$tag"           | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host "version=$current  tag=$tag  exists=$existing"

      - name: Note tag already exists
        if: steps.ver.outputs.tag_exists == 'true'
        run: echo "Tag ${{ steps.ver.outputs.tag }} already exists — skipping subsequent build/release steps."

      - name: Install dependencies
        if: steps.ver.outputs.tag_exists == 'false'
        run: npm ci || npm install --no-audit --no-fund

      - name: Install Inno Setup (installer compiler)
        if: steps.ver.outputs.tag_exists == 'false'
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Install Playwright Chromium (shipped alongside the .exe)
        if: steps.ver.outputs.tag_exists == 'false'
        run: npx playwright install chromium

      - name: Build portable .exe + installer (@yao-pkg/pkg)
        if: steps.ver.outputs.tag_exists == 'false'
        run: npm run build:exe

      # Un release que no bootea NO se publica: este step falla el job y todos
      # los steps posteriores (stage/tag/release/discord) se saltan porque no
      # tienen `if: always()` — son condicionales al éxito de este step.
      - name: Smoke test — boot Shinobi.exe and verify HTTP 200 on :3333
        if: steps.ver.outputs.tag_exists == 'false'
        shell: pwsh
        run: |
          $exe = "build/Shinobi.exe"
          if (-not (Test-Path $exe)) {
            throw "build/Shinobi.exe no existe tras build:exe — el empaquetado falló silenciosamente."
          }
          # Runners limpios traen Windows Defender activo, que puede escanear/retrasar
          # un .exe recién compilado y sin firmar en su primera ejecución — mejor
          # excluirlo explícitamente que dejar que el timeout del smoke lo confunda
          # con un build roto. Best-effort: si el runner no lo permite, seguimos igual.
          try {
            Add-MpPreference -ExclusionPath (Resolve-Path "build").Path -ErrorAction Stop
            Write-Host "Exclusión de Windows Defender añadida para build/."
          } catch {
            Write-Host "Aviso: no se pudo añadir exclusión de Defender ($($_.Exception.Message)) — continuando."
          }
          $stdoutLog = "shinobi-stdout.log"
          $stderrLog = "shinobi-stderr.log"
          $proc = Start-Process -FilePath (Resolve-Path $exe) -PassThru -WindowStyle Hidden `
            -RedirectStandardOutput $stdoutLog -RedirectStandardError $stderrLog
          $ok = $false
          $lastErr = ""
          $crashed = $false
          for ($i = 0; $i -lt 45; $i++) {
            Start-Sleep -Seconds 2
            if ($proc.HasExited) {
              $crashed = $true
              Write-Host "Shinobi.exe terminó solo con código $($proc.ExitCode) antes de responder."
              break
            }
            try {
              $resp = Invoke-WebRequest -Uri "http://localhost:3333" -UseBasicParsing -TimeoutSec 5
              if ($resp.StatusCode -eq 200) { $ok = $true; break }
            } catch {
              $lastErr = $_.Exception.Message
            }
          }
          if ($proc -and -not $proc.HasExited) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }
          Write-Host "--- Shinobi.exe stdout ---"
          if (Test-Path $stdoutLog) { Get-Content $stdoutLog } else { Write-Host "(sin stdout)" }
          Write-Host "--- Shinobi.exe stderr ---"
          if (Test-Path $stderrLog) { Get-Content $stderrLog } else { Write-Host "(sin stderr)" }
          if (-not $ok) {
            $reason = if ($crashed) { "el proceso terminó solo (código $($proc.ExitCode))" } else { "nunca respondió (ultimo error: $lastErr)" }
            throw "Shinobi.exe no respondio HTTP 200 en :3333 — $reason — build ROTO, release ABORTADO."
          }
          Write-Host "Smoke OK: HTTP $($resp.StatusCode) en :3333."

      - name: Generate SBOM (deps + hashes exactos)
        if: steps.ver.outputs.tag_exists == 'false'
        run: npm run sbom

      - name: Stage release artefacts
        if: steps.ver.outputs.tag_exists == 'false'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-artefacts | Out-Null
          Copy-Item build/Shinobi.exe "release-artefacts/Shinobi-${{ steps.ver.outputs.version }}.exe"
          if (Test-Path build/Shinobi-Setup.exe) {
            Copy-Item build/Shinobi-Setup.exe "release-artefacts/Shinobi-Setup-${{ steps.ver.outputs.version }}.exe"
          }
          if (Test-Path build/sbom.json) {
            Copy-Item build/sbom.json "release-artefacts/sbom-${{ steps.ver.outputs.version }}.json"
          }
          Get-ChildItem release-artefacts

      - name: Generate changelog
        if: steps.ver.outputs.tag_exists == 'false'
        shell: pwsh
        run: |
          node scripts/release/generate_changelog.mjs > release-artefacts/CHANGELOG.md
          Get-Content release-artefacts/CHANGELOG.md | Select-Object -First 60

      - name: Tag commit
        if: steps.ver.outputs.tag_exists == 'false' && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.ver.outputs.tag }}
          git push origin ${{ steps.ver.outputs.tag }}

      - name: Create GitHub release
        if: steps.ver.outputs.tag_exists == 'false' && github.event.inputs.dry_run != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Shinobi ${{ steps.ver.outputs.version }}
          body_path: release-artefacts/CHANGELOG.md
          files: |
            release-artefacts/*

      - name: Notify Discord
        # G3.3 — only fires if the user has set the DISCORD_WEBHOOK_URL secret.
        if: steps.ver.outputs.tag_exists == 'false' && github.event.inputs.dry_run != 'true' && env.DISCORD != ''
        shell: pwsh
        env:
          DISCORD: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          $payload = @{
            username = "shinobi-releases"
            content  = "Shinobi ${{ steps.ver.outputs.version }} shipped — https://github.com/${{ github.repository }}/releases/tag/${{ steps.ver.outputs.tag }}"
          } | ConvertTo-Json
          Invoke-RestMethod -Method Post -Uri $env:DISCORD -ContentType 'application/json' -Body $payload

      - name: Dry-run summary
        if: steps.ver.outputs.tag_exists == 'false' && github.event.inputs.dry_run == 'true'
        shell: pwsh
        run: |
          Write-Host "dry_run=true: build + smoke + SBOM OK. No se creó tag ni release."
          Get-ChildItem release-artefacts
